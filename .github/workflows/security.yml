name: security

on:
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "frontend/**"
      - "tests/**"
      - ".github/**"
      - "requirements*"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "19 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install verified security tooling
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-security.txt

      - name: Python security analysis
        run: bandit -r scanner .github/scripts -q

      - name: Known dependency vulnerabilities
        run: pip-audit --require-hashes -r requirements-security.txt --progress-spinner off

      - name: Frontend injection regressions
        run: node tests/frontend_security.cjs

      - name: Install verified workflow and secret analyzers
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

      - name: Workflow validation
        run: '"$RUNNER_TEMP/actionlint"'

      - name: Secret scan across Git history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner'
