name: schedule-probe
run-name: Sonde planification · ${{ github.event_name }} · run ${{ github.run_number }}

on:
  # Diagnostic window: 2 November, 19:00–21:55 UTC. GitHub cron has no
  # year field, so remove this workflow after the diagnosis.
  schedule:
    - cron: "*/5 19-21 2 11 *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/schedule-probe.yml"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record GitHub trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          EVENT_REF: ${{ github.ref }}
        run: |
          echo 'Hello world - test de planification GitHub Actions'
          {
            printf '## Diagnostic de planification\n\n'
            printf -- '- Événement : %s\n' "$EVENT_NAME"
            printf -- '- Cron : %s\n' "$EVENT_SCHEDULE"
            printf -- '- Branche : %s\n' "$EVENT_REF"
            printf -- '- Heure UTC : %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"

