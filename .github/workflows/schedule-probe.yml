name: schedule-probe
run-name: Sonde planification · ${{ github.event_name }} · run ${{ github.run_number }}

on:
  # Temporary probe; remove this workflow after diagnosing the scheduler.
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/schedule-probe.yml"

permissions: {}

jobs:
  probe:
    # The first two runs are from pushes. Limit scheduled runner use while
    # keeping the workflow run visible if GitHub creates later events.
    if: github.event_name != 'schedule' || github.run_number <= 5
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hello world
        run: echo 'Hello world - test de planification GitHub Actions'

