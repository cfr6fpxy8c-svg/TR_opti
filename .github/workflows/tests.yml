name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install QA tooling
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Frontend syntax and injection regression checks
        run: node tests/frontend_security.cjs

      - name: Unit + integration tests
        run: python -m pytest tests/ -q

      - name: Byte-compile the engine
        run: python -m compileall -q scanner tests

      - name: Validate committed JSON
        run: python -m scanner.validate_data

      # Guards the specific regressions found in the v1.2 audit: the docs must
      # not claim a test count that does not exist, and the badge must point at
      # the file the engine actually writes.
      - name: Documentation consistency
        run: python -m scanner.check_docs
