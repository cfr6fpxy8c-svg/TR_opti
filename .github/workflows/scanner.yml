name: scanner
run-name: BTC scan · ${{ github.event_name }} · run ${{ github.run_number }}

on:
  schedule:
    # Same :07/:22/:37/:52 slots. A writer pushing this changed expression
    # to the default branch re-registers the schedule and its actor.
    - cron: "7-59/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "config/**"
      - ".github/workflows/scanner.yml"
      - ".github/scripts/publish_data.py"

concurrency:
  group: scanner-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      data_ready: ${{ steps.upload.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Record trigger
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          {
            printf '## BTC scan trigger\n\n'
            printf -- '- Event: `%s`\n' "$TRIGGER_EVENT"
            printf -- '- Cron: `%s`\n' "$TRIGGER_CRON"
            printf -- '- Branch: `%s`\n' "$TRIGGER_REF"
            printf -- '- Actor: `%s`\n' "$TRIGGER_ACTOR"
            printf -- '- Started at: `%s` UTC\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run BTC scan
        id: scan
        run: python -m scanner.main --symbols BTCUSDT
        continue-on-error: true

      - name: Validate published JSON
        run: python -m scanner.validate_data

      - name: Transfer validated results
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-data
          retention-days: 1
          if-no-files-found: error
          path: |
            data/signals.json
            data/performance.json
            data/system-status.json
            data/market-snapshots.json
            data/latest-chart.json
            data/universe-snapshot.json
            frontend/data/signals.json
            frontend/data/performance.json
            frontend/data/system-status.json
            frontend/data/market-snapshots.json
            frontend/data/latest-chart.json
            frontend/data/universe-snapshot.json
            frontend/data/badge.json
            frontend/dashboard-offline.html
            frontend/preview.html

      - name: Propagate scan failure
        if: steps.scan.outcome == 'failure'
        run: |
          echo '::error::BTC scan failed; last valid data and failure status are retained.'
          exit 1

  publish:
    needs: scan
    if: ${{ !cancelled() && needs.scan.outputs.data_ready == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scan-data
          path: .scan-output

      - name: Publish only approved generated files
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python .github/scripts/publish_data.py
