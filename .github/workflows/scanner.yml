name: scanner
run-name: BTC scan · ${{ inputs.source || github.event_name }} · run ${{ github.run_number }}

on:
  # An external cron dispatches source=cron at :00/:15/:30/:45 UTC; GitHub's
  # own schedule never delivered on this repository.
  workflow_dispatch:
    inputs:
      source:
        description: "Dispatch origin"
        type: choice
        options: [manual, cron]
        default: manual
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "config/**"
      - ".github/workflows/scanner.yml"
      - ".github/scripts/publish_data.py"

concurrency:
  group: scanner-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      # Secrets cannot be tested in step conditions directly.
      GCP_CONFIGURED: ${{ secrets.GCP_WIF_PROVIDER != '' && secrets.GCP_SA != '' && secrets.GCP_PROJECT != '' }}
    outputs:
      data_ready: ${{ steps.upload.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Record trigger
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ inputs.source }}
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          {
            printf '## BTC scan trigger\n\n'
            printf -- '- Event: %s\n' "$TRIGGER_EVENT"
            printf -- '- Source: %s\n' "$TRIGGER_SOURCE"
            printf -- '- Branch: %s\n' "$TRIGGER_REF"
            printf -- '- Actor: %s\n' "$TRIGGER_ACTOR"
            printf -- '- Started at: %s UTC\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run BTC scan
        id: scan
        env:
          SCAN_TRIGGER: ${{ inputs.source == 'cron' && 'schedule' || github.event_name }}
        run: python -m scanner.main --symbols BTCUSDT
        continue-on-error: true

      - name: Run Tendance 4H (paper trading)
        id: trend4h
        run: python -m scanner.trend4h
        continue-on-error: true

      - name: Authenticate to Google Cloud (keyless)
        id: gcp
        if: env.GCP_CONFIGURED == 'true'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA }}
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false

      - name: Run AI analyst (shadow, no effect on trades)
        id: ai
        timeout-minutes: 5
        continue-on-error: true
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: python -m scanner.ai_analyst

      - name: Run Tendance 4H + renfort 1H (second paper portfolio)
        id: trendcombo
        run: python -m scanner.trend_combo
        continue-on-error: true

      - name: Authenticate to Google Cloud for the combo analyst (keyless)
        id: gcp2
        if: env.GCP_CONFIGURED == 'true'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA }}
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false

      - name: Run AI analyst for 4H + 1H (shadow, no effect on trades)
        id: aicombo
        timeout-minutes: 4
        continue-on-error: true
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_ACCESS_TOKEN: ${{ steps.gcp2.outputs.access_token }}
        run: python -m scanner.ai_combo

      - name: Validate published JSON
        run: python -m scanner.validate_data

      - name: Transfer validated results
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-data
          retention-days: 1
          if-no-files-found: error
          path: |
            data/signals.json
            data/performance.json
            data/system-status.json
            data/market-snapshots.json
            data/latest-chart.json
            data/universe-snapshot.json
            data/trend4h-paper.json
            data/ai-analyst.json
            data/trend-combo-paper.json
            data/ai-combo.json
            frontend/data/signals.json
            frontend/data/performance.json
            frontend/data/system-status.json
            frontend/data/market-snapshots.json
            frontend/data/latest-chart.json
            frontend/data/universe-snapshot.json
            frontend/data/trend4h-paper.json
            frontend/data/ai-analyst.json
            frontend/data/trend-combo-paper.json
            frontend/data/ai-combo.json
            frontend/data/badge.json

      - name: Propagate scan failure
        if: steps.scan.outcome == 'failure'
        run: |
          echo '::error::BTC scan failed; last valid data and failure status are retained.'
          exit 1

  publish:
    needs: scan
    if: ${{ !cancelled() && needs.scan.outputs.data_ready == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scan-data
          path: .scan-output

      - name: Publish only approved generated files
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python .github/scripts/publish_data.py
